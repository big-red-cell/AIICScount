<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>dropme</title></head>
<body>
<h3>dropme.html (origin http://127.0.0.1:8001)</h3>
<div id="target" contenteditable="true"
     style="width:520px;height:220px;border:1px solid #000;background:#fff;padding:8px;overflow:auto">
  drop here
</div>
<iframe id="frame" src="http://127.0.0.1:8000/dragme.html"
        style="display:block;width:600px;height:130px;border:1px solid #00f;margin-top:12px"></iframe>
<script>
  var t = document.getElementById('target');
  t.addEventListener('dragenter', function (e) { console.log('dragenter'); });
  t.addEventListener('dragover', function (e) { e.preventDefault(); }); // allow drop
  t.addEventListener('drop', function (e) {
    console.log('DROP types=' + Array.prototype.slice.call(e.dataTransfer.types).join(','));
    console.log('DROP text/html=' + e.dataTransfer.getData('text/html'));
    // NOTE: no preventDefault() -> rely on default contenteditable drop behavior
  });
  window.addEventListener('error', function (e) { console.log('WINDOW-ERROR ' + e.message); }, true);
  ['dragenter','dragover','drop','dragend','dragleave'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      console.log('DOC-' + ev + ' target=' + (e.target.id || e.target.tagName));
    }, true);
  });
</script>
</body>
</html>
