[project]
name = "aiic-three-stage-pipeline"
version = "0.1.0"
description = "Adapters for report analysis, OpenClaw reproduction, and attack-prompt generation."
requires-python = ">=3.12"
dependencies = [
    "openai>=2.33.0",
    "python-dotenv>=1.1.1",
    "requests>=2.33.1",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.tmp/pytest-tmp -p no:cacheprovider"
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["pipeline"]
