<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>dragme source (origin A)</title>
</head>
<body>
<h3>dragme.html - drag source (origin A)</h3>
<div id="draggable" draggable="true"
     style="width:260px;height:110px;background:#cde;border:1px solid #000;padding:8px;">
  Drag me into the other page's contenteditable
</div>
<script>
  document.getElementById('draggable').addEventListener('dragstart', function (e) {
    // No sanitization of the HTML payload: contains active content (img onerror).
    e.dataTransfer.setData('text/html',
      '<img src="x" onerror="alert(\'XSS-FIRED origin=\' + location.origin)">');
    e.dataTransfer.setData('text/plain', 'hello from origin A');
    e.dataTransfer.effectAllowed = 'copy';
  });
</script>
</body>
</html>
