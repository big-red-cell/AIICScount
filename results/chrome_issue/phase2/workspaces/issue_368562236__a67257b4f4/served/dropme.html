<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>dropme target (origin B)</title>
</head>
<body>
<h3>dropme.html - drop target (origin B)</h3>
<p>Contenteditable drop zone below. No explicit drop handler: the browser default
action inserts dropped text/html into the contenteditable element.</p>
<div id="dropzone" contenteditable="true"
     style="width:420px;height:200px;border:2px dashed #999;background:#ffe;padding:8px;">
  drop here
</div>
</body>
</html>
