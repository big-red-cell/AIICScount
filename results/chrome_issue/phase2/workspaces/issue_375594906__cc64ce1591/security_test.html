<!DOCTYPE html>
<html>
<head>
    <title>Security Test</title>
</head>
<body>
    <h3>File Path Security Test</h3>
    <input type="file" id="fileInput" webkitdirectory mozdirectory>
    <div id="output"></div>
    
    <script>
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length > 0) {
                const file = files[0];
                let info = 'Selected file: ' + file.name + '<br>';
                info += 'webkitRelativePath: ' + (file.webkitRelativePath || 'not available') + '<br>';
                info += 'Full path should NOT be visible for security reasons<br>';
                document.getElementById('output').innerHTML = info;
            }
        });
        
        // Try to simulate the attack
        document.getElementById('output').innerHTML = 'Select a directory to test security behavior';
    </script>
</body>
</html>
