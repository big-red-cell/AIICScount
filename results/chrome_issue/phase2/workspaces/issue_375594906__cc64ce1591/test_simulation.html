<html>
<head>
    <title>Test Simulation</title>
</head>
<body>
    <h3 id="qmsg">Testing webkitRelativePath behavior</h3>
    <div id="result"></div>
    
    <script>
        // Simulate a File object with webkitRelativePath
        // In a real scenario, this would come from the file input
        const mockFile = {
            webkitRelativePath: "Documents/test.txt"
        };
        
        // Display what would be shown
        document.getElementById('qmsg').innerHTML = mockFile.webkitRelativePath;
        document.getElementById('result').innerHTML = "Simulated webkitRelativePath: " + mockFile.webkitRelativePath;
        
        // Note: In a real attack, if the browser leaked the full path,
        // it might show something like "/home/username/Documents/test.txt"
        // but modern browsers should only show "Documents/test.txt"
    </script>
</body>
</html>
